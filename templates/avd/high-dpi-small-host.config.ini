# High-DPI / small-host AVD profile (ISSUE-12).
# Use this when a tall AVD (for example 1080x2424) opens with its top cropped on
# a 125% display. Prefer the non-destructive runtime overrides:
#   emulator_boot { "avdName": "Pixel_9_API_35", "headless": false, "scale": 0.5 }
#   emulator_boot { "avdName": "Pixel_9_API_35", "headless": false, "windowSize": "900x600" }
# Only copy the LCD overrides below into ~/.android/avd/<name>.avd/config.ini
# when the runtime options are not enough: they change the emulated screen size.
hw.lcd.width=1080
hw.lcd.height=1620
hw.lcd.density=420
