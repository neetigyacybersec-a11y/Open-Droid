name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present
      - run: node --test test/privacy.test.mjs
      - run: bash scripts/check-readme.sh
      - run: bash scripts/repo-hygiene.sh
      - run: node scripts/lifecycle-matrix.mjs --check

  # Windows equivalent: the MCP server (build + tests that are not POSIX-stub
  # based) must stay green on Windows hosts, where most users hit broken paths.
  mcp-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: bash scripts/check-readme.sh

  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - run: cd examples/vuln-app && gradle :app:assembleDebug --no-daemon

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: android-mcp:ci
