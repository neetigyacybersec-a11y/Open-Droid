name: CI

on:
  push:
    branches: [main]
  pull_request:

# Issue 72 [security]: workflow-level least privilege; jobs never get write.
permissions:
  contents: read

# ISSUE-162: cancel only superseded pull-request runs. Main pushes keep their
# own group so they cannot be cancelled by unrelated PR activity.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-main', github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      # ISSUE-160: one authoritative verifier; it builds once and runs every
      # mandatory gate exactly once on Linux and Windows alike.
      - run: node scripts/verify.mjs

  # ISSUE-107: dependency and build-system edits are reviewed in the same
  # pipeline as source. The job needs full history to resolve the push base,
  # and publishes a human-readable summary even when it fails the build.
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Resolve diff base
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Review dependency and build-system changes
        shell: bash
        run: |
          set +e
          node scripts/dependency-review.mjs \
            --base "${{ steps.base.outputs.base }}" \
            --format markdown \
            --fail-on high > dependency-review.md 2> dependency-review.err
          status=$?
          set -e
          cat dependency-review.err >&2 || true
          if [ -f dependency-review.md ]; then
            cat dependency-review.md
            cat dependency-review.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  # Windows equivalent: the MCP server (build + tests that are not POSIX-stub
  # based) must stay green on Windows hosts, where most users hit broken paths.
  mcp-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm.cmd ci
      - run: node scripts/verify.mjs

  # FR-B6 / ISSUE-22: CI builds and tests every app the repo ships, not just one.
  android-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app-dir:
          - examples/hello-compose
          - templates/compose-starter
          - examples/vuln-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - name: Pin Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build, unit-test, lint (${{ matrix.app-dir }})
        # Roborazzi verify: apps without goldens/Roborazzi ignore the property;
        # the template fails on pixel diff vs committed goldens (FR-B2 slice 2).
        run: cd ${{ matrix.app-dir }} && gradle :app:assembleDebug :app:testDebugUnitTest -Proborazzi.test.verify=true :app:lintDebug --no-daemon
      - name: Verify release versioning contract
        if: matrix.app-dir == 'templates/compose-starter'
        # ISSUE-122: run real Gradle fixtures for explicit/env/shallow/missing history.
        run: node --test test/version-code.test.mjs

  # FR-B2 + FR-B6: the template's instrumented Compose test executes on one API
  # level; the vendored toolchain hosts lack KVM, so this runs only in CI.
  android-instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      # Runner images drift to newer Gradle releases (run 45463364723 used
      # 9.9.1, which cannot resolve the template's Kotlin 2.0.21 plugin).
      # Pin the version vendored by versions.env so CI matches local builds.
      - name: Pin Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      # Run 42685876691 root cause: the runner user lacks /dev/kvm group access,
      # so the emulator ran in software mode; the app under test then ANR'd
      # during its first post-install launch (odex generation, >30 s startup
      # window) and the kill surfaced as "Instrumentation run failed due to
      # Process crashed". With KVM the launch completes in seconds.
      - name: Grant the runner user KVM access (udev rule + chmod fallback, no restart)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sleep 1
          # Deterministic fallback: the previous run's udevadm trigger did not
          # re-apply the rule and test -w failed before the emulator even booted.
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -w /dev/kvm
      - name: Instrumented Compose test on API 35 emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          # FR-B2 slice 3: the same emulator session also runs the committed
          # Maestro smoke flow (M2 exit criterion). AGP uninstalls the app
          # after connected tests, so reinstall before the flow.
          script: |
            gradle -p templates/compose-starter :app:connectedDebugAndroidTest --no-daemon
            # Pinned to the version vendored locally (.toolchain/maestro, 2.12.1):
            # the flow YAML behavior must be identical in CI and locally. The
            # latest installer pulled a version whose driver startup failed in
            # ~5 s (run 43025545346).
            curl -Ls -o /tmp/maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip"
            unzip -q -o /tmp/maestro.zip -d "$HOME/.maestro-cli-pin"
            mkdir -p "$HOME/.maestro"
            # The launcher resolves jars relative to ../lib, so copy the whole
            # tree — bin only → ClassNotFoundException maestro.cli.AppKt,
            # instant exit (run 43027448490).
            cp -a "$HOME"/.maestro-cli-pin/maestro/. "$HOME/.maestro/"
            # Locally (software mode) the maestro driver was killed by the
            # system's 30 s startup ANR before its fixed default timeout; the
            # env only buys slack on a slow runner, KVM keeps it irrelevant.
            # NOTE: the runner executes this script line by line, so PATH must
            # be set inline on the maestro line (run 43024737147: "maestro: not found").
            gradle -p templates/compose-starter :app:installDebug --no-daemon
            PATH="$HOME/.maestro/bin:$PATH" maestro --version
            # Single line required: the runner executes this script line by line,
            # so no multi-line blocks (run 43026639163 parse failure).
            # Upstream flake (maestro issue 3684 / MAE-628): the CLI picks the
            # driver port via host ServerSocket(0) (Linux ephemeral 32768-60999)
            # but the driver binds it ON THE DEVICE, where it can collide with
            # the device's own ephemeral range -> BindException in grpcServer ->
            # AndroidDriverTimeoutException ~6-14 s later (runs 43160387369,
            # 43161053168). --driver-host-port 7001 pins a port below the
            # device's ephemeral range (the <=2.5.0 behavior). Flag verified
            # present in cli 2.12.1 TestCommand.class.
            # MAESTRO_DRIVER_STARTUP_TIMEOUT is parsed as MILLISECONDS
            # (AndroidDriver.getStartupTimeout default 15000L, no unit
            # conversion) — our old value of 180 gave awaitLaunch a 180 ms
            # poll window, so any driver startup slower than that failed
            # outright (run 43162090162). 180000 = the intended 180 s.
            # ISSUE-161: one bounded retry, both attempts reported separately.
            node scripts/maestro-smoke.mjs
      - name: Upload Maestro diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-diagnostics
          path: maestro-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # ISSUE-141: a green Docker build is not evidence that handlers work. Build
  # the image, then run the in-container capability + MCP handler smoke.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          # ISSUE-141: the smoke step needs the image in the local daemon.
          load: true
          tags: open-droid:latest
      - name: Dependency, capability and MCP handler smoke
        run: docker run --rm --entrypoint bash open-droid:latest scripts/docker-smoke.sh

  # Stable aggregate required check for branch protection (#98). It runs for
  # every PR even when an upstream job fails, so a missing/non-green required
  # job cannot masquerade as success.
  required:
    name: required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - mcp
      - mcp-windows
      - android-matrix
      - android-instrumented
      - docker
      - dependency-review
    steps:
      - name: Verify every required job succeeded
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const bad = Object.entries(needs).filter(([, value]) => value.result !== "success");
            if (bad.length > 0) {
              console.error("required job(s) did not succeed:");
              for (const [name, value] of bad) console.error(` - ${name}: ${value.result}`);
              process.exit(1);
            }
            console.log("all required jobs succeeded");
          '
