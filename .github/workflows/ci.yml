name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present
      - run: node --test test/privacy.test.mjs
      - run: bash scripts/check-readme.sh
      - run: bash scripts/repo-hygiene.sh
      - run: node scripts/lifecycle-matrix.mjs --check

  # Windows equivalent: the MCP server (build + tests that are not POSIX-stub
  # based) must stay green on Windows hosts, where most users hit broken paths.
  mcp-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: bash scripts/check-readme.sh

  # FR-B6 / ISSUE-22: CI builds and tests every app the repo ships, not just one.
  android-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app-dir:
          - examples/hello-compose
          - templates/compose-starter
          - examples/vuln-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - name: Build, unit-test, lint (${{ matrix.app-dir }})
        # Roborazzi verify: apps without goldens/Roborazzi ignore the property;
        # the template fails on pixel diff vs committed goldens (FR-B2 slice 2).
        run: cd ${{ matrix.app-dir }} && gradle :app:assembleDebug :app:testDebugUnitTest -Proborazzi.test.verify=true :app:lintDebug --no-daemon

  # FR-B2 + FR-B6: the template's instrumented Compose test executes on one API
  # level; the vendored toolchain hosts lack KVM, so this runs only in CI.
  android-instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      # Run 42685876691 root cause: the runner user lacks /dev/kvm group access,
      # so the emulator ran in software mode; the app under test then ANR'd
      # during its first post-install launch (odex generation, >30 s startup
      # window) and the kill surfaced as "Instrumentation run failed due to
      # Process crashed". With KVM the launch completes in seconds.
      - name: Grant the runner user KVM access (udev rule + chmod fallback, no restart)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sleep 1
          # Deterministic fallback: the previous run's udevadm trigger did not
          # re-apply the rule and test -w failed before the emulator even booted.
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -w /dev/kvm
      - name: Instrumented Compose test on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # FR-B2 slice 3: the same emulator session also runs the committed
          # Maestro smoke flow (M2 exit criterion). AGP uninstalls the app
          # after connected tests, so reinstall before the flow.
          script: |
            gradle -p templates/compose-starter :app:connectedDebugAndroidTest --no-daemon
            # Pinned to the version vendored locally (.toolchain/maestro, 2.12.1):
            # the flow YAML behavior must be identical in CI and locally. The
            # latest installer pulled a version whose driver startup failed in
            # ~5 s (run 43025545346).
            curl -Ls -o /tmp/maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip"
            unzip -q -o /tmp/maestro.zip -d "$HOME/.maestro-cli-pin"
            mkdir -p "$HOME/.maestro"
            # The launcher resolves jars relative to ../lib, so copy the whole
            # tree — bin only → ClassNotFoundException maestro.cli.AppKt,
            # instant exit (run 43027448490).
            cp -a "$HOME"/.maestro-cli-pin/maestro/. "$HOME/.maestro/"
            # Locally (software mode) the maestro driver was killed by the
            # system's 30 s startup ANR before its fixed default timeout; the
            # env only buys slack on a slow runner, KVM keeps it irrelevant.
            # NOTE: the runner executes this script line by line, so PATH must
            # be set inline on the maestro line (run 43024737147: "maestro: not found").
            gradle -p templates/compose-starter :app:installDebug --no-daemon
            PATH="$HOME/.maestro/bin:$PATH" maestro --version
            # Single line required: the runner executes this script line by line,
            # so no multi-line blocks (run 43026639163 parse failure).
            MAESTRO_DRIVER_STARTUP_TIMEOUT=180 PATH="$HOME/.maestro/bin:$PATH" maestro test templates/compose-starter/maestro/smoke.yaml || { echo '=== maestro failed: device events + crash buffer ==='; adb logcat -d -b events 2>/dev/null | grep -E 'maestro|am_anr|am_kill' | tail -20; adb logcat -d -b crash 2>/dev/null | tail -30; exit 1; }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: android-mcp:ci
