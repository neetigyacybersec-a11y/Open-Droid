name: Release

on:
  push:
    tags: ["v*"]

# Issue 72 [security]: no default write token anywhere; publish jobs get only
# what their mechanism needs (id-token for provenance, packages:write for GHCR)
# and are gated on the validate job plus a named environment (configure
# required reviewers on the `release` environment in repo settings).
permissions:
  contents: read

# ISSUE-162: release runs are isolated from PR cancellation groups.
concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test

  docker:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  npm:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    # npm provenance signs with the OIDC token (npm >= 9.5, public registry).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ISSUE-152: versioned host-install artifacts. Every publish job still needs
  # `validate`, so failed tests prevent all publication steps.
  host-artifacts:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build versioned artifacts and package-manager manifests
        run: node scripts/release-artifacts.mjs --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --out dist/release --packaging
      - name: Verify checksums before publication
        run: node scripts/release-artifacts.mjs --verify --out dist/release
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/release/*.tar.gz dist/release/SHA256SUMS dist/release/release-manifest.json --clobber
          gh release upload "$GITHUB_REF_NAME" dist/release/packaging/homebrew/open-droid.rb dist/release/packaging/linux/install.sh --clobber
